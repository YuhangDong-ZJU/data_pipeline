name: Validate

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependency
        run: python -m pip install numpy==1.26.4
      - name: Check Python syntax
        run: python -m compileall -q dataset_download droid_depth droid_normals
      - name: Check Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Run dataset download tests
        run: python -m unittest discover -s dataset_download/tests -v
      - name: Run DROID normals tests
        run: python -m unittest discover -s droid_normals/tests -v
